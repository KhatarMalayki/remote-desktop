version: '3.8'

# RemoteDesk - Auto-updating deployment for Synology NAS
# Menggunakan Watchtower untuk auto-pull container terbaru dari GitHub Container Registry

services:
  remotedesk:
    image: ghcr.io/khatarmalayki/remote-desktop:latest
    container_name: remotedesk-server
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
    environment:
      - RD_ADMIN_USER=admin
      - RD_ADMIN_PASS=admin123
      - RD_API_KEY=kunci-rahasia-anda
      - RD_VPN_PILOT=true
      - RD_VPN_CIDR=10.77.0.0/24
      - RD_VPN_ENDPOINT=jatiasih.synology.me:51820
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  updater:
    image: containrrr/watchtower:latest
    container_name: remotedesk-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
