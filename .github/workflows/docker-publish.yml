name: Build & Publish Container (Auto Update)

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-macos-agent:
    uses: ./.github/workflows/build-macos-agent.yml
    permissions:
      contents: read

  sign-windows-agent:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and sign Windows UIAccess agent
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGN_CERT_PASSWORD)) {
            throw 'Windows code-signing secrets are required. Configure WINDOWS_SIGN_CERT_BASE64 and WINDOWS_SIGN_CERT_PASSWORD before publishing.'
          }
          New-Item -ItemType Directory -Force -Path prebuilt-agent | Out-Null
          $agentPath = Join-Path $PWD 'prebuilt-agent\rd-agent-windows-amd64.exe'
          $uiAccessPath = Join-Path $PWD 'prebuilt-agent\rd-agent-uiaccess.exe'
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -ldflags='-s -w' -o $agentPath ./cmd/agent
          go run github.com/akavel/rsrc@v0.10.2 -manifest cmd/agent/uiaccess.manifest -o cmd/agent/rd-agent-uiaccess_windows_amd64.syso
          go build -ldflags='-s -w' -o $uiAccessPath ./cmd/agent

          $pfxPath = Join-Path $env:RUNNER_TEMP 'remotedesk-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          certutil.exe -addstore -f Root 'certs\RemoteDesk-Internal-Root.cer' | Out-Null
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($signTool)) { throw 'signtool.exe tidak ditemukan pada runner Windows' }
          & $signTool sign /fd SHA256 /f $pfxPath /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $agentPath
          if ($LASTEXITCODE -ne 0) { throw 'Penandatanganan rd-agent.exe gagal' }
          & $signTool sign /fd SHA256 /f $pfxPath /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $uiAccessPath
          if ($LASTEXITCODE -ne 0) { throw 'Penandatanganan rd-agent-uiaccess.exe gagal' }
          Remove-Item -LiteralPath $pfxPath -Force
          $signature = Get-AuthenticodeSignature -FilePath $agentPath
          if ($signature.Status -ne 'Valid') { throw "Tanda tangan agent tidak valid: $($signature.Status)" }
          $uiAccessSignature = Get-AuthenticodeSignature -FilePath $uiAccessPath
          if ($uiAccessSignature.Status -ne 'Valid') { throw "Tanda tangan UIAccess agent tidak valid: $($uiAccessSignature.Status)" }

          # Download and unpack official signed WireGuard Windows runtime for client VPN pilot bundling
          $wgMsi = Join-Path $env:RUNNER_TEMP 'wireguard-amd64.msi'
          Invoke-WebRequest 'https://download.wireguard.com/windows-client/wireguard-amd64-0.5.3.msi' -OutFile $wgMsi -UseBasicParsing
          $expectedMsiHash = '76FCEC042C5989C5B816CD32EAED1E5B1C3B998A4B1C9ECA55F299E3314EF7E4'
          $actualMsiHash = (Get-FileHash -Algorithm SHA256 $wgMsi).Hash
          if ($actualMsiHash -ne $expectedMsiHash) { throw "WireGuard MSI hash mismatch: $actualMsiHash" }
          $msiSig = Get-AuthenticodeSignature -FilePath $wgMsi
          if ($msiSig.Status -ne 'Valid' -or -not $msiSig.SignerCertificate.Subject.Contains('WireGuard')) { throw "WireGuard MSI signature invalid: $($msiSig.Status)" }

          $code = @'
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          public class WgMsiDumper {
              [DllImport("msi.dll", CharSet = CharSet.Unicode)] static extern uint MsiOpenDatabase(string path, IntPtr persist, out IntPtr db);
              [DllImport("msi.dll", CharSet = CharSet.Unicode)] static extern uint MsiDatabaseOpenView(IntPtr db, string query, out IntPtr view);
              [DllImport("msi.dll")] static extern uint MsiViewExecute(IntPtr view, IntPtr record);
              [DllImport("msi.dll")] static extern uint MsiViewFetch(IntPtr view, out IntPtr record);
              [DllImport("msi.dll")] static extern uint MsiRecordReadStream(IntPtr record, uint field, byte[] buffer, ref uint count);
              [DllImport("msi.dll")] static extern uint MsiCloseHandle(IntPtr handle);
              public static void ExtractStream(string msi, string streamName, string outPath) {
                  IntPtr db, view, record;
                  if (MsiOpenDatabase(msi, IntPtr.Zero, out db) != 0) throw new Exception("open db failed");
                  if (MsiDatabaseOpenView(db, "SELECT Data FROM _Streams WHERE Name = '" + streamName + "'", out view) != 0) throw new Exception("open view failed");
                  MsiViewExecute(view, IntPtr.Zero);
                  if (MsiViewFetch(view, out record) != 0) throw new Exception("fetch failed");
                  using (var fs = File.Create(outPath)) {
                      byte[] buf = new byte[65536]; uint read = (uint)buf.Length;
                      while (MsiRecordReadStream(record, 1, buf, ref read) == 0 && read > 0) { fs.Write(buf, 0, (int)read); read = (uint)buf.Length; }
                  }
                  MsiCloseHandle(record); MsiCloseHandle(view); MsiCloseHandle(db);
              }
          }
'@
          Add-Type -TypeDefinition $code -Language CSharp
          $wgCab = Join-Path $env:RUNNER_TEMP 'wg-cab.cab'
          [WgMsiDumper]::ExtractStream($wgMsi, "cab1.cab", $wgCab)
          $wgExtracted = Join-Path $env:RUNNER_TEMP 'wg-extracted'
          New-Item -ItemType Directory -Force -Path $wgExtracted | Out-Null
          & expand.exe -R $wgCab -F:* $wgExtracted | Out-Null
          $wgExe = Get-ChildItem -Path $wgExtracted -Recurse -File -Filter 'wireguard.exe' | Select-Object -First 1
          if (-not $wgExe) { throw 'wireguard.exe not found in MSI' }
          $wgSig = Get-AuthenticodeSignature -FilePath $wgExe.FullName
          if ($wgSig.Status -ne 'Valid' -or -not $wgSig.SignerCertificate.Subject.Contains('WireGuard')) { throw "wireguard.exe signature invalid: $($wgSig.Status)" }
          Copy-Item -LiteralPath $wgExe.FullName -Destination (Join-Path $PWD 'prebuilt-agent\wireguard.exe') -Force

      - name: Upload signed agent
        uses: actions/upload-artifact@v4
        with:
          name: signed-windows-agent
          path: prebuilt-agent/
          if-no-files-found: error

  build-and-push:
    needs: [sign-windows-agent, build-macos-agent]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download signed Windows agent
        uses: actions/download-artifact@v4
        with:
          name: signed-windows-agent
          path: prebuilt-agent

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Download native macOS agents
        uses: actions/download-artifact@v4
        with:
          name: native-macos-agents
          path: prebuilt-agent

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
