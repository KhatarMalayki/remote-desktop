name: Release Agent Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-agent:
    uses: ./.github/workflows/build-macos-agent.yml
    permissions:
      contents: read
    with:
      version: ${{ github.ref_name }}

  release:
    needs: build-macos-agent
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Build Agent Binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME#v}
          echo "Building version: $VERSION"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/rd-agent-windows-amd64.exe ./cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=$VERSION" -o dist/rd-agent-linux-amd64 ./cmd/agent

      - name: Download native macOS agents
        uses: actions/download-artifact@v4
        with:
          name: native-macos-agents
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
